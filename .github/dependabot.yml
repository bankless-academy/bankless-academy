# Without this, the Dependabot Updates job failed on EVERY commit: it kept
# retrying a `decode-uri-component` advisory that has no patched version, so it
# could never succeed and a real failure would have been invisible in the noise.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # No patched version exists; reachable via @reown/appkit and jest.
      - dependency-name: decode-uri-component
      # Pinned by `resolutions`, so a bump here gets reverted anyway.
      - dependency-name: '@wagmi/connectors'
